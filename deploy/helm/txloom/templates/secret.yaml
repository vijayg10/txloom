{{- if not .Values.existingSecret }}
{{- $name := include "txloom.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.instanceKey }}
{{- if not $key }}
  {{- if and $existing $existing.data (index $existing.data "instance-key") }}
    {{- $key = index $existing.data "instance-key" | b64dec }}
  {{- else }}
    {{- $key = randAlphaNum 64 | sha256sum }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "txloom.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-password: {{ required "mysql.password (or existingSecret) is required" .Values.mysql.password | quote }}
  redis-url: {{ required "redis.url (or existingSecret) is required" .Values.redis.url | quote }}
  instance-key: {{ $key | quote }}
  connections-json: {{ .Values.config.connectionsJson | quote }}
{{- end }}
