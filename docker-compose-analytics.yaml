# Analytics stack: Kafka -> ClickHouse -> Grafana.
#
# This file is an overlay on docker-compose.yml, not a standalone project —
# it reuses the demo `kafka` broker (kafka:29092 on the shared compose
# network). Start everything together with:
#
#   docker compose -f docker-compose.yml -f docker-compose-analytics.yaml \
#     --profile demo-brokers up -d
#
# See analytics/README.md for the data model, queries, and dashboard.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    ports:
      - "8123:8123" # HTTP interface + /play SQL UI
      - "9000:9000" # native protocol (clickhouse-client)
    environment:
      CLICKHOUSE_DB: txloom_analytics
      # Username is fixed: analytics/clickhouse/users.d/named-collections.xml
      # grants it access to the Kafka named collection by name.
      CLICKHOUSE_USER: txloom
      CLICKHOUSE_PASSWORD: ${ANALYTICS_CH_PASSWORD:-txloom}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # Read by the `txloom_kafka` named collection (config.d/kafka.xml).
      ANALYTICS_KAFKA_BROKERS: ${ANALYTICS_KAFKA_BROKERS:-kafka:29092}
      ANALYTICS_KAFKA_TOPIC: ${ANALYTICS_KAFKA_TOPIC:-txloom-events}
      ANALYTICS_KAFKA_GROUP: ${ANALYTICS_KAFKA_GROUP:-txloom-analytics}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./analytics/clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
      - ./analytics/clickhouse/users.d/named-collections.xml:/etc/clickhouse-server/users.d/named-collections.xml:ro
      # Init scripts only run when clickhouse-data is empty (first start).
      - ./analytics/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      kafka:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "3001:3000" # 3000 is taken by the TxLoom api
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: ${ANALYTICS_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ANALYTICS_GRAFANA_PASSWORD:-admin}
      # Read by provisioning/datasources/clickhouse.yaml.
      ANALYTICS_CH_PASSWORD: ${ANALYTICS_CH_PASSWORD:-txloom}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./analytics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./analytics/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  grafana-data:
