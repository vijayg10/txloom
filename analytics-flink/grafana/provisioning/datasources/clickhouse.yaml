apiVersion: 1

datasources:
  - name: ClickHouse
    uid: txloom-flink-clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: true
    jsonData:
      host: flink-clickhouse
      port: 9000
      protocol: native
      secure: false
      username: txloom_flink
      defaultDatabase: txloom_flink
    secureJsonData:
      password: ${FLINK_CH_PASSWORD}
