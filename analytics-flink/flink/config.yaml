# Flink 2.x config.yaml (replaces the old flink-conf.yaml flat-key file).
# Mounted read-only over /opt/flink/conf/config.yaml by every JM/TM/gateway/
# client service in docker-compose-flink.yaml. jobmanager.rpc.address is set
# per-service via FLINK_PROPERTIES env instead of here, since it differs
# between "jobmanager" and "flink-jobmanager" depending on the reader.

state.backend.type: rocksdb
execution.checkpointing.incremental: true
execution.checkpointing.interval: 10s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
execution.checkpointing.dir: s3://flink-state/checkpoints
execution.checkpointing.savepoint-dir: s3://flink-state/savepoints

# MinIO (flink-minio in the compose overlay) speaks the S3 API; the presto
# S3 plugin just needs a custom endpoint + path-style addressing since
# MinIO doesn't support virtual-hosted-style bucket URLs.
#
# s3.access-key / s3.secret-key are NOT set here — config.yaml is a static
# file baked into the image mount and can't see compose-time env vars. Each
# service instead gets them via the FLINK_PROPERTIES env var in
# docker-compose-flink.yaml, which the Flink docker entrypoint appends to
# this file at container start (and which docker compose itself expands
# from the host/`.env` MinIO credentials).
s3.endpoint: http://flink-minio:9000
s3.path.style.access: true

restart-strategy.type: exponential-delay
restart-strategy.exponential-delay.initial-backoff: 1s
restart-strategy.exponential-delay.max-backoff: 30s

taskmanager.numberOfTaskSlots: 2
parallelism.default: 2

metrics.reporters: prom
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249

rest.address: flink-jobmanager
rest.bind-address: 0.0.0.0
