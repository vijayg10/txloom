services:
  # `--wait` only watches services with a healthcheck; the shipped compose
  # file healthchecks mysql/redis but not api, so `up --wait` would return
  # before the app tier is actually ready without this addition (research.md R3).
  api:
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The RabbitMQ sink test needs a broker; the main compose file ships it commented out.
  # AMQP has no advertised-listener redirect, so the api/worker reach it at
  # `rabbitmq:5672` and the test's consumer at `localhost:5672`.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["demo-brokers"]
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # tmpfs trades durability for startup/IO speed — acceptable since the suite
  # tears the whole stack down (`down -v`) after every execution anyway (R3).
  mysql:
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql
