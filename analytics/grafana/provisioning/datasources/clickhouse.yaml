apiVersion: 1

datasources:
  - name: ClickHouse
    uid: txloom-clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: txloom
      defaultDatabase: txloom_analytics
    secureJsonData:
      password: ${ANALYTICS_CH_PASSWORD}
