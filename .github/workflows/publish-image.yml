name: publish-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/txloom
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Check tag matches Chart.yaml
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$v" = "$(helm show chart deploy/helm/txloom | awk '/^version:/{print $2}')" \
            || { echo "tag $GITHUB_REF_NAME does not match chart version"; exit 1; }
          test "$v" = "$(helm show chart deploy/helm/txloom | awk '/^appVersion:/{gsub(/"/,"",$2); print $2}')" \
            || { echo "tag $GITHUB_REF_NAME does not match chart appVersion"; exit 1; }
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/txloom --destination dist
          helm push dist/txloom-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
